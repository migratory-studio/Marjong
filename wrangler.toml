REGULAR_RESULT_URL = "https://pbhxswjcttovsfofrddj.supabase.co/functions/v1/record-regular-result"

# 1卓 = 1 Durable Object。SQLite ストレージ版クラス＝無料プランでも使える（要・時期確認）。
[[durable_objects.bindings]]
name = "ROOM"
class_name = "MahjongRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MahjongRoom"]
